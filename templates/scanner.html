<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#059669"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería HTML5 QR Code -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body id="cuerpoFondo" class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300">

    <div class="w-full max-w-md text-center">
        <h1 class="text-xl font-bold mb-2">Escáner de Control</h1>
        <!-- Contenedor de la cámara -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-gray-700"></div>
    </div>

    <!-- Pantalla de Estado Visible (Mantiene el resultado fijo hasta reiniciar) -->
    <div id="panelEstado" class="w-full max-w-md my-4 p-6 rounded-xl bg-gray-800 border-2 border-gray-700 text-center shadow-xl">
        <p id="textoEstado" class="text-lg font-medium text-gray-300">Escanee un código QR o ingrese el dato</p>
        <p id="infoPersona" class="text-2xl font-bold mt-2"></p>
    </div>

    <!-- Panel de Botones -->
    <div class="w-full max-w-md grid grid-cols-3 gap-2 pb-4">
        <button onclick="accionConsultar()" class="bg-blue-600 hover:bg-blue-700 font-bold py-3 px-2 rounded-lg text-sm shadow">
            Consultar
        </button>
        <button onclick="accionRegistrar()" class="bg-emerald-600 hover:bg-emerald-700 font-bold py-3 px-2 rounded-lg text-sm shadow">
            Registrar
        </button>
        <button onclick="reiniciarEscanner()" class="bg-amber-600 hover:bg-amber-700 font-bold py-3 px-2 rounded-lg text-sm shadow">
            Reiniciar
        </button>
    </div>

    <script>
        let codigoEscaneadoActual = null;
        let html5QrCode;
        let scannerPausado = false;

        // Iniciar la cámara
        function iniciarCamara() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    if (!scannerPausado) {
                        codigoEscaneadoActual = decodedText;
                        // Pausar lectura de cámara para mantener estado visible
                        scannerPausado = true;
                        
                        // Al escanear, por defecto hacemos una consulta automática o mostramos el código leído
                        document.getElementById("textoEstado").innerText = "Código detectado: " + decodedText;
                        document.getElementById("infoPersona").innerText = "Elija una acción (Consultar / Registrar)";
                        document.getElementById("cuerpoFondo").className = "bg-gray-800 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                    }
                },
                (errorMessage) => { /* Ignorar errores de escaneo continuo */ }
            ).catch(err => {
                console.error("Error al iniciar la cámara", err);
            });
        }

        // 1. BOTÓN CONSULTAR: Verifica si ya está dentro
        async function accionConsultar() {
            if (!codigoEscaneadoActual) {
                alert("Primero debe escanear un código.");
                return;
            }

            let formData = new FormData();
            formData.append("codigo", codigoEscaneadoActual);

            try {
                let response = await fetch("/api/consultar", { method: "POST", body: formData });
                let data = await response.json();

                if (response.ok) {
                    if (data.ya_ingreso) {
                        // ROJO: Duplicado / Ya está dentro
                        document.getElementById("cuerpoFondo").className = "bg-red-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                        document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-red-800 border-2 border-red-500 text-center shadow-xl";
                        document.getElementById("textoEstado").innerText = "ESTADO: YA SE ENCUENTRA DENTRO";
                        document.getElementById("infoPersona").innerText = data.nombre;
                    } else {
                        // AZUL / VERDE CLARO: Existe pero aún no entra
                        document.getElementById("cuerpoFondo").className = "bg-blue-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                        document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-blue-800 border-2 border-blue-500 text-center shadow-xl";
                        document.getElementById("textoEstado").innerText = "ESTADO: REGISTRADO PERO AÚN NO ENTRA";
                        document.getElementById("infoPersona").innerText = data.nombre;
                    }
                } else {
                    // ROJO: No existe
                    document.getElementById("cuerpoFondo").className = "bg-red-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                    document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-red-800 border-2 border-red-500 text-center shadow-xl";
                    document.getElementById("textoEstado").innerText = "NO ENCONTRADO";
                    document.getElementById("infoPersona").innerText = data.message;
                }
            } catch (error) {
                console.error("Error en consulta", error);
            }
        }

        // 2. BOTÓN REGISTRAR: Registra su llegada si no ha entrado
        async function accionRegistrar() {
            if (!codigoEscaneadoActual) {
                alert("Primero debe escanear un código.");
                return;
            }

            let formData = new FormData();
            formData.append("codigo", codigoEscaneadoActual);

            try {
                let response = await fetch("/api/registrar", { method: "POST", body: formData });
                let data = await response.json();

                if (response.ok) {
                    // AZUL EXITOSO: Ingreso registrado correctamente
                    document.getElementById("cuerpoFondo").className = "bg-blue-700 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                    document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-blue-600 border-2 border-blue-400 text-center shadow-xl";
                    document.getElementById("textoEstado").innerText = "¡INGRESO EXITOSO!";
                    document.getElementById("infoPersona").innerText = data.nombre;
                } else {
                    // ROJO: Duplicado o error
                    document.getElementById("cuerpoFondo").className = "bg-red-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
                    document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-red-800 border-2 border-red-500 text-center shadow-xl";
                    document.getElementById("textoEstado").innerText = "ACCESO DENEGADO";
                    document.getElementById("infoPersona").innerText = data.message;
                }
            } catch (error) {
                console.error("Error en registro", error);
            }
        }

        // 3. BOTÓN REINICIAR: Limpia el estado y deja listo el escáner para una nueva lectura
        function reiniciarEscanner() {
            codigoEscaneadoActual = null;
            scannerPausado = false;
            
            // Restablecer colores y textos originales
            document.getElementById("cuerpoFondo").className = "bg-gray-900 text-white min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-300";
            document.getElementById("panelEstado").className = "w-full max-w-md my-4 p-6 rounded-xl bg-gray-800 border-2 border-gray-700 text-center shadow-xl";
            document.getElementById("textoEstado").innerText = "Escanee un código QR";
            document.getElementById("infoPersona").innerText = "";
        }

        // Arrancar cámara al cargar la página
        window.addEventListener("load", iniciarCamara);
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registrado con éxito', reg))
        .catch(err => console.log('Error al registrar Service Worker', err));
    });
  }
</script>
</body>
</html>
